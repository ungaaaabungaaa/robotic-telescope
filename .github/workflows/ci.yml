name: Verify offline telescope lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install recorded dependencies
        run: python -m pip install -r requirements-benchmark.txt
      - name: Install development package
        run: python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
      - name: Behavior tests and branch coverage
        run: python -m pytest --cov=robotic_telescope --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Recorded coordinate and mount evidence
        run: python tools/verify_recorded.py
      - name: Build distribution
        run: python -m build --no-isolation
      - name: Installed wheel outside source tree
        shell: bash
        run: python tools/check_wheel.py dist/*.whl
